<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VidChopper | Local chapter clip export</title>
    <meta
      name="description"
      content="VidChopper is a local Windows app and CLI for turning one source video into verified chapter clips with ffmpeg."
    />
    <link rel="canonical" href="https://vidchopper.app/" />
    <meta
      property="og:title"
      content="VidChopper | Local chapter clip export"
    />
    <meta
      property="og:description"
      content="Plan, export, and verify local chapter clips with VidChopper."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vidchopper.app/" />
    <meta name="theme-color" content="#08050f" />
    <link rel="icon" type="image/png" href="/src/assets/app-icon.png" />
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <noscript>
      <main class="noscript-onboarding">
        <p class="noscript-kicker">VidChopper works without a website account</p>
        <h1>Start locally without JavaScript</h1>
        <p>
          Download the app, read the human guide, or select this prompt and paste it into your agent.
          The site never receives your media or local paths.
        </p>
        <label for="noscript-agent-prompt">Agent starter prompt</label>
        <textarea id="noscript-agent-prompt" rows="6" readonly>Follow https://vidchopper.app/agents/vidchopper-cli/SKILL.md. Inspect my video and chapter inputs, show me a dry-run, and ask before exporting, overwriting, uploading, publishing, or deleting anything.</textarea>
        <nav aria-label="No-JavaScript starting points">
          <a href="https://github.com/devin-thomas/vid-chopper/releases/download/v1.1.0/VidChopper-1.1.0-windows-x64.zip">Download v1.1.0</a>
          <a href="https://vidchopper.app/docs">Read the docs</a>
          <a href="https://vidchopper.app/agents/vidchopper-cli/SKILL.md">Inspect the full skill</a>
        </nav>
      </main>
    </noscript>
    <div id="root"></div>
  </body>
</html>
