name: CI

on:
  push:
    branches:
      - main
      - app-foundation
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      agent_skill: ${{ steps.filter.outputs.agent_skill }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '.clang-*'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'packaging/**'
              - 'src/**'
              - 'tests/**'
              - 'tools/**'
              - 'vcpkg.json'
            docs:
              - '.gitattributes'
              - '.gitignore'
              - '.agents/skills/vidchopper-cli/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cloudflare.yml'
              - '.github/workflows/pages.yml'
              - '.github/workflows/release.yml'
              - 'CMakeLists.txt'
              - 'CONTEXT.md'
              - 'README.md'
              - 'VIDCHOPPER_TEAM_KNOWLEDGE_BASE.md'
              - 'docs/**'
              - 'examples/chapter-config.json'
              - 'examples/chapter-config.yaml'
              - 'examples/chapter-config/**'
              - 'knowledge/README.md'
              - 'knowledge/architecture/**'
              - 'knowledge/operations/pages-rewrite-brief.md'
              - 'knowledge/operations/cloudflare-production.md'
              - 'knowledge/operations/publishing-and-workflows.md'
              - 'knowledge/skills/vidchopper-cli-agent-skill-design.md'
              - 'packaging/releases/**'
              - 'packaging/windows/README.txt'
              - 'src/cli/cli_arguments.cpp'
              - 'src/cli/manifest_writer.cpp'
              - 'tools/agent-skill-artifacts.ps1'
              - 'tools/package-windows.ps1'
              - 'tools/verify-release-archive.ps1'
              - 'tools/verification-common.ps1'
              - 'tools/verify.ps1'
            agent_skill:
              - '.agents/skills/vidchopper-cli/**'
              - '.gitattributes'
              - '.github/workflows/ci.yml'
              - 'docs/routes.json'
              - 'docs/schemas/chapter-config/v1/schema.json'
              - 'examples/chapter-config/v1/chapter-config.json'
              - 'examples/chapter-config/v1/chapter-config.yaml'
              - 'packaging/releases/agent-skills/**'
              - 'src/cli/cli_arguments.cpp'
              - 'tests/fixtures/chapterbuilder/tns-2xko-36-chapters.json'
              - 'tools/agent-skill-artifacts.ps1'

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python with pinned-tool cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/verification-requirements.txt

      - name: Install GCC 13
        run: sudo apt-get update && sudo apt-get install -y g++-13

      - name: Install pinned source-quality tools
        run: python -m pip install -r tools/verification-requirements.txt

      - name: Run repository lint lane
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/ci | Out-Null
          pwsh -NoProfile -File tools/verify.ps1 -CiLane Lint 2>&1 |
            Tee-Object -FilePath artifacts/ci/lint.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare lint failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path artifacts/ci/lint.log) {
            Get-Content artifacts/ci/lint.log -Tail 250 | Set-Content artifacts/ci/lint-failure.log
          } else {
            "Failure occurred before the repository lint lane; see the job log." | Set-Content artifacts/ci/lint-failure.log
          }

      - name: Upload lint failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics-${{ github.run_attempt }}
          path: artifacts/ci/lint-failure.log
          if-no-files-found: warn
          retention-days: 7

  agent-skill-check:
    needs: changes
    if: needs.changes.outputs.agent_skill == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deterministic agent skill artifacts
        shell: pwsh
        run: pwsh -NoProfile -File tools/agent-skill-artifacts.ps1 -Mode Check

  core-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@v4.3.3

      - name: Set up cached vcpkg dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
          vcpkgJsonGlob: '**/vcpkg.json'
          runVcpkgInstall: false

      - name: Install FFmpeg 7.1.1
        shell: pwsh
        run: |
          $attempts = 5
          for ($i = 1; $i -le $attempts; $i++) {
            choco install ffmpeg --version=7.1.1 --yes --no-progress
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 30
          }
          Write-Error "ffmpeg install failed after $attempts attempts"
          exit 1

      - name: Run repository core lane
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/ci | Out-Null
          pwsh -NoProfile -File tools/verify.ps1 -CiLane Core 2>&1 |
            Tee-Object -FilePath artifacts/ci/core.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare core failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path artifacts/ci/core.log) {
            Get-Content artifacts/ci/core.log -Tail 250 | Set-Content artifacts/ci/core-failure.log
          } else {
            "Failure occurred before the repository core lane; see the job log." | Set-Content artifacts/ci/core-failure.log
          }

      - name: Upload core failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-diagnostics-${{ github.run_attempt }}
          path: |
            artifacts/ci/core-failure.log
            build/core-release/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 7

  gui-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@v4.3.3

      - name: Set up cached vcpkg dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
          vcpkgJsonGlob: '**/vcpkg.json'
          runVcpkgInstall: false

      - name: Install cached Qt 6.9
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.9.0
          host: windows
          target: desktop
          cache: true
          cache-key-prefix: vidchopper-qt-6.9.0

      - name: Install FFmpeg 7.1.1
        shell: pwsh
        run: |
          $attempts = 5
          for ($i = 1; $i -le $attempts; $i++) {
            choco install ffmpeg --version=7.1.1 --yes --no-progress
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 30
          }
          Write-Error "ffmpeg install failed after $attempts attempts"
          exit 1

      - name: Run repository GUI lane
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/ci | Out-Null
          pwsh -NoProfile -File tools/verify.ps1 -CiLane Gui 2>&1 |
            Tee-Object -FilePath artifacts/ci/gui.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare GUI failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path artifacts/ci/gui.log) {
            Get-Content artifacts/ci/gui.log -Tail 250 | Set-Content artifacts/ci/gui-failure.log
          } else {
            "Failure occurred before the repository GUI lane; see the job log." | Set-Content artifacts/ci/gui-failure.log
          }

      - name: Upload GUI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-diagnostics-${{ github.run_attempt }}
          path: artifacts/ci/gui-failure.log
          if-no-files-found: warn
          retention-days: 7

  docs-check:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Run repository docs lane
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/ci | Out-Null
          pwsh -NoProfile -File tools/verify.ps1 -CiLane Docs 2>&1 |
            Tee-Object -FilePath artifacts/ci/docs.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare docs failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path artifacts/ci/docs.log) {
            Get-Content artifacts/ci/docs.log -Tail 250 | Set-Content artifacts/ci/docs-failure.log
          } else {
            "Failure occurred before the repository docs lane; see the job log." | Set-Content artifacts/ci/docs-failure.log
          }

      - name: Upload docs failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-diagnostics-${{ github.run_attempt }}
          path: artifacts/ci/docs-failure.log
          if-no-files-found: warn
          retention-days: 7
