name: Pages

on:
  push:
    branches:
      - main
    paths:
      - .gitattributes
      - .agents/skills/vidchopper-cli/**
      - CMakeLists.txt
      - docs/**
      - examples/chapter-config.json
      - examples/chapter-config.yaml
      - examples/chapter-config/**
      - packaging/releases/**
      - packaging/windows/README.txt
      - src/cli/cli_arguments.cpp
      - src/cli/manifest_writer.cpp
      - tools/agent-skill-artifacts.ps1
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install frontend dependencies
        working-directory: docs
        run: npm ci

      - name: Validate agent skill artifacts
        shell: pwsh
        run: pwsh -NoProfile -File tools/agent-skill-artifacts.ps1 -Mode Check

      - name: Build Pages site
        working-directory: docs
        run: npm run build:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
