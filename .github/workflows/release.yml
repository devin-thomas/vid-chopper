name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: 1.1.0
        type: string
      publish:
        description: Publish only a finalized stable release after the clean archive smoke test passes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  CMAKE_VERSION: 3.31.6
  NINJA_VERSION: 1.12.1
  QT_VERSION: 6.9.0
  VCPKG_COMMIT: 03e366fb91e38b9432ebd5f8cc79f7c8f55e96ab

jobs:
  package-candidate:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      PUBLISH: ${{ inputs.publish }}
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $publishRequested = [string]::Equals($env:PUBLISH, "true", [StringComparison]::OrdinalIgnoreCase)
          if ($env:GITHUB_REF_NAME -ne "main") {
            throw "Release candidates must run from main, not $env:GITHUB_REF_NAME."
          }
          $cmake = Get-Content -Raw -LiteralPath "CMakeLists.txt"
          if ($cmake -notmatch 'VIDCHOPPER_DISPLAY_VERSION "([^"]+)"') {
            throw "VIDCHOPPER_DISPLAY_VERSION is missing."
          }
          if ($Matches[1] -ne $env:VERSION) {
            throw "CMake version '$($Matches[1])' does not match '$env:VERSION'."
          }
          $docsVersion = (Get-Content -Raw -LiteralPath "docs/package.json" | ConvertFrom-Json).version
          $releaseManifestPath = Join-Path "packaging/releases" "${env:VERSION}.json"
          if (-not (Test-Path -LiteralPath $releaseManifestPath -PathType Leaf)) {
            throw "Release manifest is missing: $releaseManifestPath"
          }
          $releaseManifest = Get-Content -Raw -LiteralPath $releaseManifestPath | ConvertFrom-Json
          if ([string]$releaseManifest.version -ne $env:VERSION -or
              [string]$releaseManifest.cliVersion -ne $env:VERSION -or
              [string]$releaseManifest.tag -ne "v$($env:VERSION)" -or
              [string]$releaseManifest.channel -ne "stable") {
            throw "Release manifest version tuple does not match '$env:VERSION'."
          }
          $expectedAsset = "VidChopper-$($env:VERSION)-windows-x64.zip"
          $expectedChecksum = "${expectedAsset}.sha256"
          $assets = @($releaseManifest.assets)
          $assetNames = @($assets | ForEach-Object { [string]$_.name })
          if ($assets.Count -ne 2 -or
              (($assetNames | Sort-Object) -join "|") -ne ((@($expectedAsset, $expectedChecksum) | Sort-Object) -join "|")) {
            throw "Release manifest must contain exactly the Windows ZIP/checksum asset pair."
          }
          $expectedUrls = @(
            "https://github.com/devin-thomas/vid-chopper/releases/download/v$($env:VERSION)/$expectedAsset",
            "https://github.com/devin-thomas/vid-chopper/releases/download/v$($env:VERSION)/$expectedChecksum"
          )
          for ($index = 0; $index -lt $assets.Count; $index++) {
            if ([string]$assets[$index].url -ne $expectedUrls[$index]) {
              throw "Release manifest asset URL drifted for '$($assets[$index].name)'."
            }
          }
          $publicationStatus = [string]$releaseManifest.publicationStatus
          $candidatePending = $publicationStatus -eq "candidate-pending"
          if ($candidatePending) {
            if ($publishRequested) {
              throw "Refusing to publish '$($env:VERSION)': the manifest is still candidate-pending Windows qualification."
            }
            if ($null -ne $releaseManifest.publishedAt -or $null -ne $releaseManifest.sourceCommit) {
              throw "Pending release candidates must not contain publication time or source commit metadata."
            }
            foreach ($asset in $assets) {
              if ($null -ne $asset.size -or $null -ne $asset.sha256 -or
                  [string]$asset.status -ne "pending-windows-qualification") {
                throw "Pending release candidate assets must remain unqualified and unhashed."
              }
            }
            Write-Host "Windows release metadata remains candidate-pending; no Windows qualification is claimed."
          } elseif ($publishRequested) {
            if ($null -eq $releaseManifest.publishedAt -or
                [string]$releaseManifest.sourceCommit -notmatch '^[a-f0-9]{40}$') {
              throw "Publishing requires finalized release timestamp and source commit metadata."
            }
            foreach ($asset in $assets) {
              if ([int64]$asset.size -le 0 -or [string]$asset.sha256 -notmatch '^[a-f0-9]{64}$') {
                throw "Publishing requires finalized ZIP and checksum asset metadata."
              }
            }
          } elseif ($publicationStatus -ne "") {
            throw "Unsupported release publicationStatus '$publicationStatus'."
          }
          if ([string]$docsVersion -ne $env:VERSION) {
            if (-not $candidatePending) {
              throw "Docs version '$docsVersion' does not match '$env:VERSION'."
            }
            Write-Host "Docs remain on stable version '$docsVersion' during candidate qualification for '$env:VERSION'."
          }

      - name: Set up CMake
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
          ninjaVersion: ${{ env.NINJA_VERSION }}

      - name: Set up cached vcpkg dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ runner.temp }}/vcpkg'
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgJsonGlob: '**/vcpkg.json'
          runVcpkgInstall: false
          binaryCachePath: '${{ runner.temp }}/vcpkg-binary-cache/windows-x64-msvc-${{ env.VCPKG_COMMIT }}'

      - name: Install cached Qt 6.9
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          cache-key-prefix: vidchopper-qt-${{ env.QT_VERSION }}-windows-x64-msvc2022

      - name: Install FFmpeg 7.1.1
        shell: pwsh
        run: |
          $attempts = 5
          for ($i = 1; $i -le $attempts; $i++) {
            choco install ffmpeg --version=7.1.1 --yes --no-progress
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 30
          }
          Write-Error "ffmpeg install failed after $attempts attempts"
          exit 1

      - name: Set up pinned source-quality tools
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned source-quality tools
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r tools/verification-requirements.txt

      - name: Set up Node.js for documentation contracts
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Run canonical Windows release qualification lane
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          pwsh -NoProfile -File tools/verify.ps1 -Tier Release 2>&1 |
            Tee-Object -FilePath artifacts/release-qualification.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: vidchopper-windows-x64-${{ inputs.version }}
          path: |
            artifacts/release/VidChopper-${{ inputs.version }}-windows-x64.zip
            artifacts/release/VidChopper-${{ inputs.version }}-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 1

  smoke-clean-archive:
    needs: package-candidate
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout release tests and fixture
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact release candidate
        uses: actions/download-artifact@v4
        with:
          name: vidchopper-windows-x64-${{ inputs.version }}
          path: artifacts/candidate

      - name: Install FFmpeg 7.1.1
        shell: pwsh
        run: |
          $attempts = 5
          for ($i = 1; $i -le $attempts; $i++) {
            choco install ffmpeg --version=7.1.1 --yes --no-progress
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 30
          }
          Write-Error "ffmpeg install failed after $attempts attempts"
          exit 1

      - name: Verify candidate checksum
        shell: pwsh
        run: |
          $zip = "artifacts/candidate/VidChopper-$($env:VERSION)-windows-x64.zip"
          $checksum = "${zip}.sha256"
          $checksumLine = (Get-Content -Raw -LiteralPath $checksum).Trim()
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $expectedLine = "$actual *$(Split-Path -Leaf $zip)"
          if ($checksumLine -ne $expectedLine) {
            throw "Candidate checksum line mismatch: expected '$expectedLine', got '$checksumLine'."
          }

      - name: Verify extracted archive on clean Windows
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/verify-release-archive.ps1 `
            -Version $env:VERSION `
            -ArchivePath "artifacts/candidate/VidChopper-$env:VERSION-windows-x64.zip" `
            -EvidencePath "artifacts/evidence/release-candidate-evidence.json"

      - name: Upload clean-runner evidence
        uses: actions/upload-artifact@v4
        with:
          name: vidchopper-release-evidence-${{ inputs.version }}
          path: artifacts/evidence/release-candidate-evidence.json
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: smoke-clean-archive
    if: ${{ inputs.publish }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-environment
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download proven release candidate
        uses: actions/download-artifact@v4
        with:
          name: vidchopper-windows-x64-${{ inputs.version }}
          path: artifacts/candidate

      - name: Confirm finalized release metadata
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg version "$VERSION" '
            .version == $version and
            .cliVersion == $version and
            .publicationStatus != "candidate-pending" and
            (.publishedAt | type == "string") and
            (.sourceCommit | type == "string" and test("^[a-f0-9]{40}$")) and
            (.assets | length == 2) and
            all(.assets[]; (.size | type == "number" and . > 0) and (.sha256 | test("^[a-f0-9]{64}$")))
          ' "packaging/releases/${VERSION}.json" >/dev/null

      - name: Publish proven stable release
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          asset="artifacts/candidate/VidChopper-${VERSION}-windows-x64.zip"
          checksum="${asset}.sha256"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $tag" >&2
            exit 1
          fi
          gh release create "$tag" "$asset" "$checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "VidChopper ${VERSION}" \
            --notes-file "packaging/releases/${VERSION}.md"

      - name: Verify remote stable release and asset
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          asset_name="VidChopper-${VERSION}-windows-x64.zip"
          checksum_name="${asset_name}.sha256"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,url,assets > artifacts/release.json
          jq -e --arg tag "$tag" --arg asset "$asset_name" --arg checksum "$checksum_name" '
            .tagName == $tag and
            .isDraft == false and
            .isPrerelease == false and
            any(.assets[]; .name == $asset) and
            any(.assets[]; .name == $checksum)
          ' artifacts/release.json >/dev/null
          mkdir -p artifacts/remote
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset_name" --dir artifacts/remote
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "$checksum_name" --dir artifacts/remote
          cmp "artifacts/candidate/$checksum_name" "artifacts/remote/$checksum_name"
          expected="$(cut -d ' ' -f 1 "artifacts/remote/$checksum_name")"
          actual="$(sha256sum "artifacts/remote/$asset_name" | cut -d ' ' -f 1)"
          test "$expected" = "$actual"
          cat artifacts/release.json
