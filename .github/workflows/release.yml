name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: 1.2.0
        type: string
      mode:
        description: Qualify immutable candidates or promote a passed candidate run
        required: true
        default: qualify
        type: choice
        options:
          - qualify
          - publish
      macos_candidate_run_id:
        description: Passed macOS Candidate workflow run containing the exact DMG and CLI archive
        required: true
        type: string
      release_candidate_run_id:
        description: Passed Release qualify run to promote; required only in publish mode
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ inputs.version }}-${{ inputs.mode }}
  cancel-in-progress: false

env:
  CMAKE_VERSION: 3.31.6
  NINJA_VERSION: 1.12.1
  QT_VERSION: 6.9.0
  VCPKG_COMMIT: 03e366fb91e38b9432ebd5f8cc79f7c8f55e96ab

jobs:
  package-windows-candidate:
    if: ${{ inputs.mode == 'qualify' }}
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate candidate metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF_NAME -ne "main") {
            throw "Release candidates must run from main, not $env:GITHUB_REF_NAME."
          }
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version must be a numeric semantic version."
          }
          $cmake = Get-Content -Raw -LiteralPath "CMakeLists.txt"
          if ($cmake -notmatch 'VIDCHOPPER_DISPLAY_VERSION "([^"]+)"' -or $Matches[1] -ne $env:VERSION) {
            throw "CMake display version does not match '$env:VERSION'."
          }
          $manifestPath = Join-Path "packaging/releases" "$($env:VERSION).json"
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          if ([string]$manifest.version -ne $env:VERSION -or
              [string]$manifest.cliVersion -ne $env:VERSION -or
              [string]$manifest.tag -ne "v$($env:VERSION)" -or
              [string]$manifest.channel -ne "stable" -or
              [string]$manifest.publicationStatus -ne "candidate-pending") {
            throw "Release candidate metadata is not the expected pending stable tuple."
          }

      - name: Set up CMake
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
          ninjaVersion: ${{ env.NINJA_VERSION }}

      - name: Prepare vcpkg binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force '${{ runner.temp }}/vcpkg-binary-cache/windows-x64-msvc-${{ env.VCPKG_COMMIT }}' | Out-Null

      - name: Set up cached vcpkg dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ runner.temp }}/vcpkg'
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgJsonGlob: '**/vcpkg.json'
          runVcpkgInstall: false
          binaryCachePath: '${{ runner.temp }}/vcpkg-binary-cache/windows-x64-msvc-${{ env.VCPKG_COMMIT }}'

      - name: Install cached Qt 6.9
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          cache-key-prefix: vidchopper-qt-${{ env.QT_VERSION }}-windows-x64-msvc2022

      - name: Install FFmpeg 7.1.1
        shell: pwsh
        run: |
          $attempts = 5
          for ($i = 1; $i -le $attempts; $i++) {
            choco install ffmpeg --version=7.1.1 --yes --no-progress
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 30
          }
          Write-Error "ffmpeg install failed after $attempts attempts"
          exit 1

      - name: Set up pinned source-quality tools
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned source-quality tools
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r tools/verification-requirements.txt

      - name: Set up Node.js for documentation contracts
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Run canonical Windows release qualification lane
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          pwsh -NoProfile -File tools/verify.ps1 -Tier Release 2>&1 |
            Tee-Object -FilePath artifacts/release-qualification.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload immutable Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: vidchopper-windows-x64-${{ inputs.version }}
          path: |
            artifacts/release/VidChopper-${{ inputs.version }}-windows-x64.zip
            artifacts/release/VidChopper-${{ inputs.version }}-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows qualification failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-failure-${{ inputs.version }}-${{ github.run_attempt }}
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 14

  smoke-windows-candidate:
    needs: package-windows-candidate
    if: ${{ inputs.mode == 'qualify' }}
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout release tests and fixture
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact Windows candidate
        uses: actions/download-artifact@v4
        with:
          name: vidchopper-windows-x64-${{ inputs.version }}
          path: artifacts/candidate

      - name: Install FFmpeg 7.1.1
        shell: pwsh
        run: |
          $attempts = 5
          for ($i = 1; $i -le $attempts; $i++) {
            choco install ffmpeg --version=7.1.1 --yes --no-progress
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 30
          }
          Write-Error "ffmpeg install failed after $attempts attempts"
          exit 1

      - name: Verify exact archive on clean Windows
        shell: pwsh
        run: |
          $zip = "artifacts/candidate/VidChopper-$($env:VERSION)-windows-x64.zip"
          $checksum = "${zip}.sha256"
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $expectedLine = "$actual *$(Split-Path -Leaf $zip)"
          if ((Get-Content -Raw -LiteralPath $checksum).Trim() -ne $expectedLine) {
            throw "Windows candidate checksum line does not match the archive."
          }
          pwsh -NoProfile -File tools/verify-release-archive.ps1 `
            -Version $env:VERSION `
            -ArchivePath $zip `
            -EvidencePath "artifacts/evidence/windows-candidate-evidence.json"

      - name: Upload clean-runner Windows evidence
        uses: actions/upload-artifact@v4
        with:
          name: vidchopper-windows-evidence-${{ inputs.version }}
          path: artifacts/evidence/windows-candidate-evidence.json
          if-no-files-found: error
          retention-days: 30

  aggregate-candidates:
    needs: smoke-windows-candidate
    if: ${{ inputs.mode == 'qualify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      MACOS_CANDIDATE_RUN_ID: ${{ inputs.macos_candidate_run_id }}

    steps:
      - name: Checkout release verification contract
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate macOS candidate run identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$MACOS_CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "macos_candidate_run_id must be a GitHub Actions run number." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MACOS_CANDIDATE_RUN_ID" > artifacts-macos-run.json
          jq -e --arg sha "$GITHUB_SHA" '
            .name == "macOS Candidate" and
            .event == "workflow_dispatch" and
            .status == "completed" and
            .conclusion == "success" and
            .head_branch == "main" and
            .head_sha == $sha
          ' artifacts-macos-run.json >/dev/null

      - name: Download exact Windows candidate
        uses: actions/download-artifact@v4
        with:
          name: vidchopper-windows-x64-${{ inputs.version }}
          path: artifacts/candidate

      - name: Download Windows evidence
        uses: actions/download-artifact@v4
        with:
          name: vidchopper-windows-evidence-${{ inputs.version }}
          path: artifacts/evidence/windows

      - name: Download exact macOS candidates
        uses: actions/download-artifact@v4
        with:
          name: vidchopper-macos-arm64-${{ inputs.version }}
          path: artifacts/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.macos_candidate_run_id }}

      - name: Download macOS automated evidence
        uses: actions/download-artifact@v4
        with:
          pattern: vidchopper-macos-evidence-${{ inputs.version }}-*
          path: artifacts/evidence/macos
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.macos_candidate_run_id }}

      - name: Verify and record the cumulative candidate set
        shell: bash
        run: |
          set -euo pipefail
          windows="VidChopper-${VERSION}-windows-x64.zip"
          dmg="VidChopper-${VERSION}-macos-arm64.dmg"
          cli="VidChopper-${VERSION}-macos-arm64-cli.tar.gz"
          binaries=("$windows" "$dmg" "$cli")
          assets=("$windows" "${windows}.sha256" "$dmg" "${dmg}.sha256" "$cli" "${cli}.sha256")

          for binary in "${binaries[@]}"; do
            checksum="artifacts/candidate/${binary}.sha256"
            expected="$(awk 'NR == 1 { print $1 }' "$checksum")"
            recorded="$(awk 'NR == 1 { print $2 }' "$checksum")"
            recorded="${recorded%$'\r'}"
            actual="$(sha256sum "artifacts/candidate/$binary" | awk '{ print $1 }')"
            if [[ "$expected" != "$actual" || "${recorded#\*}" != "$binary" ]]; then
              echo "Candidate checksum pair is invalid: $binary" >&2
              exit 1
            fi
          done

          mac_evidence="artifacts/evidence/macos/macos-candidate-evidence.json"
          jq -e --arg version "$VERSION" --arg sha "$GITHUB_SHA" --arg run "$MACOS_CANDIDATE_RUN_ID" '
            .productVersion == $version and
            .sourceCommit == $sha and
            (.workflow.runId | tostring) == $run and
            .outcome == "passed" and
            .physicalAcceptanceRequired == true and
            all(.tests[];
              .outcome == "passed" or
              (.name == "videotoolbox-runner-capability" and .outcome == "unavailable-physical-required")
            )
          ' "$mac_evidence" >/dev/null
          for binary in "$dmg" "$cli"; do
            actual="$(sha256sum "artifacts/candidate/$binary" | awk '{ print $1 }')"
            jq -e --arg name "$binary" --arg sha "$actual" '
              any(.artifacts[]; .name == $name and .sha256 == $sha)
            ' "$mac_evidence" >/dev/null
          done

          mkdir -p artifacts/evidence/cumulative
          for asset in "${assets[@]}"; do
            path="artifacts/candidate/$asset"
            jq -n \
              --arg name "$asset" \
              --arg sha256 "$(sha256sum "$path" | awk '{ print $1 }')" \
              --argjson size "$(stat -c '%s' "$path")" \
              '{name: $name, size: $size, sha256: $sha256}'
          done | jq -s '.' > artifacts/evidence/cumulative/assets.json

          jq -n \
            --arg version "$VERSION" \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg releaseCandidateRunId "$GITHUB_RUN_ID" \
            --arg macosCandidateRunId "$MACOS_CANDIDATE_RUN_ID" \
            --arg timestamp "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --slurpfile assets artifacts/evidence/cumulative/assets.json \
            --slurpfile windows artifacts/evidence/windows/windows-candidate-evidence.json \
            --slurpfile macos "$mac_evidence" \
            '{
              schemaVersion: 1,
              productVersion: $version,
              sourceCommit: $sourceCommit,
              workflow: {
                releaseCandidateRunId: $releaseCandidateRunId,
                macosCandidateRunId: $macosCandidateRunId
              },
              artifacts: $assets[0],
              automatedEvidence: {windows: $windows[0], macos: $macos[0]},
              physicalAcceptanceRequired: true,
              timestamp: $timestamp,
              outcome: "passed"
            }' > artifacts/evidence/cumulative/release-candidate-evidence.json

          jq \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg version "$VERSION" \
            --slurpfile assets artifacts/evidence/cumulative/assets.json \
            '.publicationStatus = "release-ready" |
             .publishedAt = null |
             .sourceCommit = $sourceCommit |
             .assets = [$assets[0][] | . + {
               url: ("https://github.com/devin-thomas/vid-chopper/releases/download/v" + $version + "/" + .name),
               status: "qualified"
             }]' \
            "packaging/releases/${VERSION}.json" \
            > artifacts/evidence/cumulative/release-ready-manifest.json

          jq \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg macosCandidateRunId "$MACOS_CANDIDATE_RUN_ID" \
            --arg dmg "$dmg" \
            --arg cli "$cli" \
            --slurpfile assets artifacts/evidence/cumulative/assets.json \
            '.sourceCommit = $sourceCommit |
             .macosCandidateRunId = $macosCandidateRunId |
             .artifacts = [$assets[0][] |
               select(.name == $dmg or .name == $cli) |
               {name: .name, sha256: .sha256}
             ]' \
            packaging/releases/macos-physical-evidence.example.json \
            > artifacts/evidence/cumulative/macos-physical-evidence.pending.json

      - name: Upload immutable cumulative candidates
        uses: actions/upload-artifact@v4
        with:
          name: vidchopper-release-candidates-${{ inputs.version }}
          path: artifacts/candidate/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload cumulative automated evidence
        uses: actions/upload-artifact@v4
        with:
          name: vidchopper-release-evidence-${{ inputs.version }}
          path: artifacts/evidence/**
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: ${{ inputs.mode == 'publish' }}
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-environment
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      RELEASE_CANDIDATE_RUN_ID: ${{ inputs.release_candidate_run_id }}
      MACOS_CANDIDATE_RUN_ID: ${{ inputs.macos_candidate_run_id }}

    steps:
      - name: Checkout release record and notes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate promotion inputs and candidate run
        shell: bash
        run: |
          set -euo pipefail
          for run_id in "$RELEASE_CANDIDATE_RUN_ID" "$MACOS_CANDIDATE_RUN_ID"; do
            if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
              echo "Publish mode requires numeric candidate run IDs." >&2
              exit 1
            fi
          done
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$GITHUB_REF_NAME" != main ]]; then
            echo "Publish mode requires a numeric semantic version dispatched from main." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_CANDIDATE_RUN_ID" > artifacts-release-run.json
          jq -e '
            .name == "Release" and
            .event == "workflow_dispatch" and
            .status == "completed" and
            .conclusion == "success" and
            .head_branch == "main"
          ' artifacts-release-run.json >/dev/null

      - name: Download proven cumulative candidates
        uses: actions/download-artifact@v4
        with:
          name: vidchopper-release-candidates-${{ inputs.version }}
          path: artifacts/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_candidate_run_id }}

      - name: Download cumulative automated evidence
        uses: actions/download-artifact@v4
        with:
          name: vidchopper-release-evidence-${{ inputs.version }}
          path: artifacts/evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_candidate_run_id }}

      - name: Enforce release and two-Mac physical evidence
        shell: bash
        run: |
          set -euo pipefail
          manifest="packaging/releases/${VERSION}.json"
          physical="packaging/releases/${VERSION}-macos-physical-evidence.json"
          cumulative="artifacts/evidence/cumulative/release-candidate-evidence.json"
          source_sha="$(jq -r '.head_sha' artifacts-release-run.json)"
          [[ -f "$physical" ]]
          jq -e --arg version "$VERSION" --arg source "$source_sha" '
            .version == $version and
            .cliVersion == $version and
            .tag == ("v" + $version) and
            .channel == "stable" and
            .publicationStatus == "release-ready" and
            .publishedAt == null and
            .sourceCommit == $source and
            (.assets | length == 6) and
            all(.assets[]; .status == "qualified" and (.size | type == "number" and . > 0) and (.sha256 | test("^[a-f0-9]{64}$")))
          ' "$manifest" >/dev/null
          jq -e --arg version "$VERSION" --arg source "$source_sha" --arg relrun "$RELEASE_CANDIDATE_RUN_ID" --arg macrun "$MACOS_CANDIDATE_RUN_ID" '
            .productVersion == $version and
            .sourceCommit == $source and
            (.workflow.releaseCandidateRunId | tostring) == $relrun and
            (.workflow.macosCandidateRunId | tostring) == $macrun and
            .physicalAcceptanceRequired == true and
            .outcome == "passed"
          ' "$cumulative" >/dev/null
          jq -e --arg version "$VERSION" --arg source "$source_sha" --arg macrun "$MACOS_CANDIDATE_RUN_ID" '
            .productVersion == $version and
            .sourceCommit == $source and
            (.macosCandidateRunId | tostring) == $macrun and
            .outcome == "passed" and
            ([.machines[].role] | sort) == ["m1-air", "m4-pro"] and
            all(.machines[];
              .outcome == "passed" and
              ([.hardwareModel, .cpuModel, .osVersion, .osBuild, .ffmpegVersion, .ffprobeVersion, .tester, .timestamp] |
                all(.[]; type == "string" and length > 0))
            ) and
            (.firstLaunch.machineRole == "m1-air" or .firstLaunch.machineRole == "m4-pro") and
            .firstLaunch.browserDownloaded == true and
            .firstLaunch.quarantineObserved == true and
            .firstLaunch.perAppApproval == true and
            .firstLaunch.globalGatekeeperChanged == false
          ' "$physical" >/dev/null

          required_tests=(
            checksum-pairs app-install-and-relaunch source-probe embedded-chapters default-chapters
            chapter-editing x264-export videotoolbox-export cancellation-no-orphans manifest-verification
            output-folder-open native-settings-persistence explicit-portable-config-error cli-archive
            cli-installer-no-sudo cli-installed-new-shell cli-dry-run cli-real-export
          )
          for role in m1-air m4-pro; do
            for test_name in "${required_tests[@]}"; do
              jq -e --arg role "$role" --arg test "$test_name" '
                any(.machines[]; .role == $role and any(.tests[]; .name == $test and .outcome == "passed"))
              ' "$physical" >/dev/null
            done
          done

          while IFS= read -r name; do
            path="artifacts/candidate/$name"
            [[ -f "$path" ]]
            actual="$(sha256sum "$path" | awk '{ print $1 }')"
            size="$(stat -c '%s' "$path")"
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${name}"
            jq -e --arg name "$name" --arg sha "$actual" --arg url "$url" --argjson size "$size" '
              any(.assets[]; .name == $name and .url == $url and .sha256 == $sha and .size == $size)
            ' "$manifest" >/dev/null
            jq -e --arg name "$name" --arg sha "$actual" --argjson size "$size" '
              any(.artifacts[]; .name == $name and .sha256 == $sha and .size == $size)
            ' "$cumulative" >/dev/null
          done < <(jq -r '.assets[].name' "$manifest")
          for name in \
            "VidChopper-${VERSION}-macos-arm64.dmg" \
            "VidChopper-${VERSION}-macos-arm64-cli.tar.gz"; do
            actual="$(sha256sum "artifacts/candidate/$name" | awk '{ print $1 }')"
            jq -e --arg name "$name" --arg sha "$actual" '
              any(.artifacts[]; .name == $name and .sha256 == $sha)
            ' "$physical" >/dev/null
          done

      - name: Publish unchanged stable candidates
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $tag" >&2
            exit 1
          fi
          mapfile -t assets < <(jq -r '.assets[].name | "artifacts/candidate/" + .' "packaging/releases/${VERSION}.json")
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "VidChopper ${VERSION}" \
            --notes-file "packaging/releases/${VERSION}.md"

      - name: Verify every remote release byte
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          mkdir -p artifacts/remote
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,url,assets > artifacts/release.json
          jq -e --arg tag "$tag" --argjson count "$(jq '.assets | length' "packaging/releases/${VERSION}.json")" '
            .tagName == $tag and
            .isDraft == false and
            .isPrerelease == false and
            (.assets | length) == $count
          ' artifacts/release.json >/dev/null
          while IFS= read -r name; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir artifacts/remote
            cmp "artifacts/candidate/$name" "artifacts/remote/$name"
          done < <(jq -r '.assets[].name' "packaging/releases/${VERSION}.json")
          for binary in \
            "VidChopper-${VERSION}-windows-x64.zip" \
            "VidChopper-${VERSION}-macos-arm64.dmg" \
            "VidChopper-${VERSION}-macos-arm64-cli.tar.gz"; do
            expected="$(awk 'NR == 1 { print $1 }' "artifacts/remote/${binary}.sha256")"
            actual="$(sha256sum "artifacts/remote/$binary" | awk '{ print $1 }')"
            [[ "$expected" == "$actual" ]]
          done
          cat artifacts/release.json

      - name: Upload remote verification record
        uses: actions/upload-artifact@v4
        with:
          name: vidchopper-published-release-${{ inputs.version }}
          path: artifacts/release.json
          if-no-files-found: error
          retention-days: 90
