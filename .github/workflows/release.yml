name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: 0.3.0-beta
        type: string
      publish:
        description: Publish the prerelease after the clean archive smoke test passes
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  package-candidate:
    runs-on: windows-2022
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_OUTPUT: artifacts\release

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4

      - name: Validate release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF_NAME -ne "main") {
            throw "Release candidates must run from main, not $env:GITHUB_REF_NAME."
          }
          $cmake = Get-Content -Raw CMakeLists.txt
          if ($cmake -notmatch 'VIDCHOPPER_DISPLAY_VERSION "([^"]+)"') {
            throw "VIDCHOPPER_DISPLAY_VERSION is missing."
          }
          if ($Matches[1] -ne $env:VERSION) {
            throw "CMake version '$($Matches[1])' does not match '$env:VERSION'."
          }
          $docsVersion = (Get-Content -Raw docs/package.json | ConvertFrom-Json).version
          if ($docsVersion -ne $env:VERSION) {
            throw "Docs version '$docsVersion' does not match '$env:VERSION'."
          }

      - name: Set up CMake
        uses: lukka/get-cmake@v4.3.3

      - name: Set up cached vcpkg dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/../b/vcpkg'
          vcpkgJsonGlob: '**/vcpkg.json'
          runVcpkgInstall: false

      - name: Install cached Qt 6.9
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.9.0
          host: windows
          target: desktop
          cache: true
          cache-key-prefix: vidchopper-qt-6.9.0

      - name: Install FFmpeg 7.1.1
        shell: pwsh
        run: |
          $attempts = 5
          for ($i = 1; $i -le $attempts; $i++) {
            choco install ffmpeg --version=7.1.1 --yes --no-progress
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 30
          }
          Write-Error "ffmpeg install failed after $attempts attempts"
          exit 1

      - name: Configure and build GUI package inputs
        run: |
          cmake --preset windows-gui-release
          cmake --build --preset windows-gui-release

      - name: Configure and build core package inputs
        run: |
          cmake --preset core-release
          cmake --build --preset core-release

      - name: Run release tests
        run: |
          ctest --test-dir build/core-release -C Release -L fast --output-on-failure
          ctest --test-dir build/core-release -C Release -L slow --output-on-failure
          ctest --test-dir build/windows-gui-release -C Release -L qt --output-on-failure

      - name: Package portable Windows candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageOutput = @(pwsh -NoProfile -File tools/package-windows.ps1 `
            -Version $env:VERSION `
            -OutputDirectory $env:RELEASE_OUTPUT)
          $zip = $packageOutput[-1]
          $assetName = Split-Path -Leaf $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$hash *$assetName" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: vidchopper-windows-x64-${{ inputs.version }}
          path: |
            artifacts/release/VidChopper-${{ inputs.version }}-windows-x64.zip
            artifacts/release/VidChopper-${{ inputs.version }}-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 1

  smoke-clean-archive:
    needs: package-candidate
    runs-on: windows-2022
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout release tests and fixture
        uses: actions/checkout@v4

      - name: Download exact release candidate
        uses: actions/download-artifact@v4
        with:
          name: vidchopper-windows-x64-${{ inputs.version }}
          path: artifacts/candidate

      - name: Install FFmpeg 7.1.1
        shell: pwsh
        run: |
          $attempts = 5
          for ($i = 1; $i -le $attempts; $i++) {
            choco install ffmpeg --version=7.1.1 --yes --no-progress
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 30
          }
          Write-Error "ffmpeg install failed after $attempts attempts"
          exit 1

      - name: Verify extracted archive on clean Windows
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/verify-release-archive.ps1 `
            -Version $env:VERSION `
            -ArchivePath "artifacts/candidate/VidChopper-$env:VERSION-windows-x64.zip" `
            -EvidencePath "artifacts/evidence/release-candidate-evidence.json"

      - name: Upload clean-runner evidence
        uses: actions/upload-artifact@v4
        with:
          name: vidchopper-release-evidence-${{ inputs.version }}
          path: artifacts/evidence/release-candidate-evidence.json
          if-no-files-found: error
          retention-days: 7

  publish-prerelease:
    needs: smoke-clean-archive
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download proven release candidate
        uses: actions/download-artifact@v4
        with:
          name: vidchopper-windows-x64-${{ inputs.version }}
          path: artifacts/candidate

      - name: Publish proven prerelease
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          asset="artifacts/candidate/VidChopper-${VERSION}-windows-x64.zip"
          checksum="${asset}.sha256"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $tag" >&2
            exit 1
          fi
          gh release create "$tag" "$asset" "$checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "VidChopper ${VERSION}" \
            --notes-file "packaging/releases/${VERSION}.md" \
            --prerelease

      - name: Verify remote prerelease and asset
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          asset_name="VidChopper-${VERSION}-windows-x64.zip"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,url,assets > artifacts/release.json
          jq -e --arg tag "$tag" --arg asset "$asset_name" '
            .tagName == $tag and
            .isDraft == false and
            .isPrerelease == true and
            any(.assets[]; .name == $asset)
          ' artifacts/release.json >/dev/null
          mkdir -p artifacts/remote
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset_name" --dir artifacts/remote
          expected="$(cut -d ' ' -f 1 "artifacts/candidate/${asset_name}.sha256")"
          actual="$(sha256sum "artifacts/remote/$asset_name" | cut -d ' ' -f 1)"
          test "$expected" = "$actual"
          cat artifacts/release.json
