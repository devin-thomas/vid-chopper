name: Cloudflare Pages

# Every push to main that touches the site publishes it to vidchopper.app.
on:
  push:
    branches:
      - main
    paths:
      - .gitattributes
      - .agents/skills/vidchopper-cli/**
      - CMakeLists.txt
      - docs/**
      - examples/chapter-config.json
      - examples/chapter-config.yaml
      - examples/chapter-config/**
      - packaging/releases/**
      - packaging/windows/README.txt
      - src/cli/cli_arguments.cpp
      - src/cli/manifest_writer.cpp
      - tools/agent-skill-artifacts.ps1
      - .github/workflows/cloudflare.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: cloudflare-environment
      url: https://vidchopper.app

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install pinned frontend dependencies
        working-directory: docs
        run: npm ci

      - name: Verify Cloudflare credentials before build
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Cloudflare production secrets are missing." >&2
            exit 1
          fi
          npx --no-install wrangler pages deployment list --project-name vidchopper > /dev/null
          echo "Cloudflare Pages credential preflight passed."

      - name: Validate deterministic agent skill artifacts
        shell: pwsh
        run: pwsh -NoProfile -File tools/agent-skill-artifacts.ps1 -Mode Check

      - name: Run frontend tests
        working-directory: docs
        run: npm test

      - name: Build and audit the canonical artifact
        working-directory: docs
        run: npm run build

      - name: Deploy to Cloudflare Pages
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler pages deploy dist --project-name vidchopper --branch main --commit-hash "$GITHUB_SHA"

      - name: Validate production
        working-directory: docs
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if node scripts/validate-routes.mjs --origin https://vidchopper.app; then
              exit 0
            fi
            if [[ "$attempt" == "5" ]]; then
              echo "Production validation failed after five cache-busted attempts." >&2
              exit 1
            fi
            echo "Production has not converged; retrying in 15 seconds."
            sleep 15
          done
